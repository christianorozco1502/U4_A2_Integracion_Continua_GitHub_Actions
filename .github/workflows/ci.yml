name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: juegos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Instalar dependencias
        run: |
          python -m pip install Flask Flask-Login Flask-RESTful Flask-SQLAlchemy Flask-WTF PyMySQL pytest pytest-cov

      - name: Preparar base de datos
        run: |
          python -c "import pymysql; c = pymysql.connect(host='127.0.0.1', user='root', password='root'); c.cursor().execute('CREATE DATABASE IF NOT EXISTS juegos'); c.close()"

      - name: Ejecutar pruebas y cobertura
        run: |
          python -m pytest --cov=. --cov-report=xml tests/

      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
